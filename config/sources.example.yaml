# Data sources, local model, and paths.
#
#   cp config/sources.example.yaml config/sources.yaml
#
# Your copy (config/sources.yaml) is git-ignored, so it is a safe place to keep
# an API key. This file -- the .example one -- IS tracked by git, so never put a
# real key here.
#
# Every API key resolves from the first of these that is set:
#   1. api_key       -- the key, inline
#   2. api_key_file  -- a path to a file containing only the key
#   3. api_key_env   -- the name of an environment variable holding the key

paths:
  data_dir: data
  database: data/fantasy.db
  http_cache: data/http-cache

sources:
  fantasypros:
    enabled: true
    base_url: https://api.fantasypros.com/public/v2/json/nfl
    # Paste your key here -- this file's real counterpart is git-ignored.
    # api_key: "your-fantasypros-key"
    #
    # Or keep it out of config entirely, in a file containing only the key:
    # api_key_file: config/fantasypros.key    # then: chmod 600 config/fantasypros.key
    #
    # Or leave both unset and export this environment variable instead:
    api_key_env: FANTASYPROS_API_KEY
    scoring: auto                      # auto | STD | HALF | PPR
    positions: [QB, RB, WR, TE, K, DST]
    ranking_types: [ADP, ROS, DRAFT]
    projection_week: 0                 # 0 = full season
    # Seconds between requests. A full sync is roughly two dozen calls, and
    # firing them back to back gets a key rate limited almost at once.
    # Raise this if you see HTTP 429; a 429 also raises it automatically for
    # the remainder of the run.
    rate_limit_interval: 1.0

  sleeper:
    enabled: true
    base_url: https://api.sleeper.app/v1
    # Point these at your real Sleeper draft to import picks live:
    # league_id: "1234567890"
    # draft_id: "1234567890"
    # username: your-sleeper-username
    player_cache_ttl_seconds: 86400

  # FantasyPros' website has a "Download CSV" button on every rankings and
  # projections page. Drop those files here and use:
  #   fantasy-ai sync projections --from-csv data/imports/FantasyPros_Projections_RB.csv
  csv_import:
    enabled: true
    directory: data/imports

  http:
    timeout_seconds: 20
    max_retries: 3
    backoff_seconds: 1.0
    rate_limit_interval: 0.0
    cache_ttl_seconds: 21600           # 6 hours; 0 disables the HTTP cache

  staleness_warning_hours: 24

llm:
  enabled: true
  base_url: http://localhost:1234/v1
  # The model identifier LM Studio reports for your loaded model. Check with:
  #   curl http://localhost:1234/v1/models
  # or: fantasy-ai llm models
  model: muse-glimmer
  temperature: 0.2
  max_tokens: 1200
  timeout_seconds: 120
  structured_output: json_schema       # json_schema | json_object | prompt_only | off
  max_parse_retries: 2
  max_candidates: 8
  # extra_body:
  #   top_p: 0.9

log_level: info
